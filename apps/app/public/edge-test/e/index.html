<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
<meta name="theme-color" content="#f0f0ec" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="manifest" href="manifest.webmanifest" />
<title>Edge test E</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; font-family: system-ui, sans-serif; background: #f0f0ec; color: #1d1d1b; }
  html, body { height: 100%; } body { overflow: hidden; } #scroll { height: 100%; overflow-y: auto; padding-bottom: 60px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .pad { padding: 16px; padding-top: calc(16px + env(safe-area-inset-top, 0px)); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; margin: 10px 0; background: #fff; border-radius: 10px; overflow: hidden; }
  td { padding: 6px 10px; border-bottom: 1px solid #e2e2dc; }
  td:last-child { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .row { padding: 14px 16px; border-bottom: 1px solid #e2e2dc; background: #fff; display: flex; justify-content: space-between; }
  .row:nth-child(odd) { background: #dff1ea; }
  /* Pinned to the very bottom of whatever Chrome gives the page. If you can see this magenta
     band behind the gesture pill, the page reaches the screen edge. */
  #edge { position: fixed; left: 0; right: 0; bottom: 0; height: 14px; background: #e3008c; color: #fff; font-size: 9px; text-align: center; line-height: 14px; letter-spacing: 1px; }
  #probe { position: fixed; visibility: hidden; padding-bottom: env(safe-area-inset-bottom, 0px); padding-top: env(safe-area-inset-top, 0px); margin-bottom: env(safe-area-max-inset-bottom, 0px); }
  a { color: #1f6f5c; }
</style>
</head>
<body>
<div id="scroll">
  <div class="pad">
    <h1>Edge test E · full screen</h1>
    <div style="font-size:13px;color:#6b6b66">Same layout as A, installed as a full-screen app: the status bar and gesture pill are hidden until you swipe from an edge.</div>
    <table id="t"></table>
    <div style="font-size:13px"><a href="../index.html">All four tests</a></div>
  </div>
  <div id="rows"></div>
</div>
<div id="edge">BOTTOM EDGE OF THE PAGE</div>
<div id="probe"></div>
<script>
  var rows = document.getElementById('rows');
  for (var i = 1; i <= 60; i++) { var r = document.createElement('div'); r.className = 'row'; r.innerHTML = '<span>Row ' + i + '</span><span>scroll me</span>'; rows.appendChild(r); }
  function mode() { var m = ['fullscreen', 'standalone', 'minimal-ui', 'browser']; for (var i = 0; i < m.length; i++) if (matchMedia('(display-mode: ' + m[i] + ')').matches) return m[i]; return '?'; }
  function read() {
    var cs = getComputedStyle(document.getElementById('probe'));
    var v = window.visualViewport;
    var chrome = (navigator.userAgent.match(/Chrome\/([\d.]+)/) || [])[1] || '?';
    var data = [
      ['Test', 'E'], ['Opened as', mode()], ['Chrome', chrome],
      ['Screen height', screen.height], ['Screen available', screen.availHeight],
      ['Window inner height', window.innerHeight], ['Window outer height', window.outerHeight],
      ['Visual viewport', v ? Math.round(v.height) : '?'], ['Pixel ratio', window.devicePixelRatio],
      ['Bottom safe area', cs.paddingBottom], ['Bottom safe area (max)', cs.marginBottom], ['Top safe area', cs.paddingTop],
      ['Screen minus page', (screen.height - window.innerHeight) + 'px'],
    ];
    document.getElementById('t').innerHTML = data.map(function (d) { return '<tr><td>' + d[0] + '</td><td>' + d[1] + '</td></tr>'; }).join('');
  }
  read(); window.addEventListener('resize', read); setTimeout(read, 800);
</script>
</body>
</html>
